<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brawsler</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%232446e0'/%3E%3Cpath d='M20 10V54M20 34a14 12 0 1 0 28 0a14 12 0 1 0 -28 0' fill='none' stroke='%23fff' stroke-width='7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;500&display=swap" rel="stylesheet">
<style id="base-css">
:root{
  --paper:#e9ede6; --surface:#f8f9f4; --ink:#17201c; --ink2:#55615b; --line:#c3cbc0;
  --accent:#2446e0; --accent-ink:#ffffff; --hi:#e6b800;
  --tb:#e4e8e1; --ts:#d0d7cd; --tf:#17201c;
  --radius:7px; --fs:15px; --tbh:42px; --devh:300px;
  --font:'Bricolage Grotesque',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --c-tag:#9a3412; --c-attr:#1d4ed8; --c-val:#166534;
}
:root[data-theme=dark]{
  --paper:#121715; --surface:#1c2320; --ink:#e4e9e1; --ink2:#9aa79f; --line:#334039;
  --accent:#8aa0ff; --accent-ink:#0d1224; --tb:#1c2320; --ts:#0f1311; --tf:#e4e9e1;
  --c-tag:#fb923c; --c-attr:#93c5fd; --c-val:#86efac;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:400 var(--fs)/1.45 var(--font);color:var(--ink);background:var(--paper);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dim{color:var(--ink2)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.stroke-txt{fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:butt;stroke-linejoin:miter;display:block}

#app{display:flex;flex-direction:column;height:100%}
#chrome{position:relative;flex:none;background-color:var(--ts);background-size:cover;background-position:center;color:var(--tf)}
#chrome::before{content:'';position:absolute;inset:0;background:var(--tb);opacity:0;pointer-events:none}
#chrome.has-img::before{opacity:calc(var(--tbdim,35)/100)}
#chrome>*{position:relative}
#tabstrip{display:flex;align-items:flex-end;gap:4px;padding:6px 8px 0;background:var(--ts);min-height:38px}
#chrome.has-img #tabstrip,#chrome.has-img #toolbar,#chrome.has-img #shortbar{background:transparent}
#tabs{display:flex;gap:2px;min-width:0;flex:0 1 auto;max-width:calc(100% - 44px);width:100%}
.tab{display:flex;align-items:center;gap:8px;height:32px;padding:0 4px 0 10px;min-width:44px;max-width:230px;flex:1 1 0;border-radius:var(--radius) var(--radius) 0 0;cursor:default;color:color-mix(in srgb,var(--tf) 72%,transparent);user-select:none;overflow:hidden}
.tab:hover{background:color-mix(in srgb,var(--tb) 55%,transparent)}
.tab.active{background:var(--tb);color:var(--tf);box-shadow:inset 0 2px 0 var(--accent)}
#chrome.has-img .tab.active{background:color-mix(in srgb,var(--tb) 88%,transparent)}
.tab .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.87em}
.tab .tx{width:22px;height:22px;border:0;background:transparent;border-radius:4px;display:grid;place-items:center;color:inherit;opacity:0;flex:none}
.tab:hover .tx,.tab.active .tx{opacity:.7}
.tab .tx:hover{opacity:1;background:color-mix(in srgb,var(--tf) 14%,transparent)}
.fav{width:16px;height:16px;flex:none;display:grid;place-items:center;font:700 10px var(--mono);border-radius:3px;overflow:hidden;color:var(--tf);background:color-mix(in srgb,var(--tf) 14%,transparent)}
.fav img{width:16px;height:16px;display:block}
.fav.int{background:color-mix(in srgb,var(--tf) 14%,transparent);color:var(--tf)}
#toolbar{display:flex;align-items:center;gap:4px;height:var(--tbh);padding:0 8px;background:var(--tb);border-bottom:1px solid var(--line)}
.ib{width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;border-radius:var(--radius);color:inherit;flex:none;padding:0}
.ib:hover:not(:disabled){background:color-mix(in srgb,var(--tf) 13%,transparent)}
.ib:disabled{opacity:.32;cursor:default}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.txt{width:auto;padding:0 8px;font:600 11.5px var(--mono);letter-spacing:.02em}
.ib.small{width:26px;height:26px}
.ib.small svg{width:16px;height:16px}
#b-star.on svg{fill:var(--hi);stroke:var(--hi)}
#omnibox-wrap{position:relative;flex:1;min-width:0;display:flex;align-items:center;height:calc(var(--tbh) - 12px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:calc(var(--radius) + 2px);padding:0 3px 0 10px;gap:6px}
#omnibox-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 28%,transparent)}
#omnibox{flex:1;border:0;outline:0;background:transparent;min-width:0;height:100%;font-size:.95em}
#site-ic{display:grid;place-items:center;color:var(--ink2)}
#sug{position:absolute;left:-1px;right:-1px;top:calc(100% + 5px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 14px 34px rgba(0,0,0,.2);z-index:60;overflow:hidden}
.sg{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:default}
.sg.on,.sg:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.sg b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg small{color:var(--ink2);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
#shortbar{display:flex;align-items:center;gap:2px;padding:3px 8px;background:var(--tb);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.sb-item{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:inherit;border-radius:var(--radius);padding:3px 8px;font-size:.84em;white-space:nowrap;max-width:170px}
.sb-item span:last-child{overflow:hidden;text-overflow:ellipsis}
.sb-item:hover{background:color-mix(in srgb,var(--tf) 12%,transparent)}
.sb-item.add{opacity:.6}

#viewport{position:relative;flex:1;min-height:0;background:var(--vp,var(--paper));overflow:hidden}
#bgimg,#bgtex,#bgdim{position:absolute;inset:0;pointer-events:none}
#bgimg{background-size:cover;background-position:center}
#bgtex[data-tex=grid]{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:34px 34px;opacity:.55}
#bgtex[data-tex=dots]{background-image:radial-gradient(var(--line) 1.3px,transparent 1.5px);background-size:22px 22px}
#bgtex[data-tex=lines]{background-image:repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 26px);opacity:.7}
#pages{position:absolute;inset:0}
.page{position:absolute;inset:0;overflow:auto}
.page.framed{display:flex;flex-direction:column;overflow:hidden;background:#fff}
.page.nt{display:flex;flex-direction:column}
.page.nt>.int{flex:1;width:100%}
.frame{flex:1;width:100%;border:0;background:#fff;min-height:0}
.framebar{flex:none;display:flex;align-items:center;gap:12px;padding:4px 12px;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);font-size:.8em}
.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-size:inherit}

.int{max-width:1060px;margin:0 auto;padding:30px 26px 90px}
body.has-bg .int:not(.newtab){background:color-mix(in srgb,var(--paper) 88%,transparent);margin-top:16px;margin-bottom:16px;border-radius:calc(var(--radius) + 4px);padding-bottom:50px}
.card{background:color-mix(in srgb,var(--surface) 93%,transparent);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--radius);font-size:.9em;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:#b42318;border-color:color-mix(in srgb,#b42318 45%,var(--line))}
.btn.sm{height:28px;padding:0 10px;font-size:.82em}
input[type=text],input[type=search],input:not([type]),select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px;min-width:0}
input[type=color]{width:38px;height:30px;padding:2px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
input[type=range]{accent-color:var(--accent);width:150px}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.ptitle{margin-bottom:18px}

.bgth{aspect-ratio:16/10;border:2px solid var(--line);border-radius:var(--radius);background-size:cover;background-position:center;padding:0;display:flex;align-items:flex-end;overflow:hidden}
.bgth.on{border-color:var(--accent)}
.bgth span{background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);font-size:.78em;padding:2px 8px;border-radius:0 var(--radius) 0 0}
.bgth:hover{border-color:var(--accent)}
/* new tab */
.newtab{display:flex;flex-direction:column;align-items:center;padding-top:8vh}
.hero{padding:6px 4px;text-align:center}
body.has-bg .hero{background:color-mix(in srgb,var(--surface) 82%,transparent);padding:14px 26px;border-radius:calc(var(--radius) + 4px)}
.clock{margin-top:12px;font-size:.9em}
.bigsearch{width:min(680px,100%);display:flex;margin-top:26px;border:1px solid var(--line);background:var(--surface);border-radius:calc(var(--radius) + 6px);height:54px;overflow:hidden}
.bigsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.bigsearch input{flex:1;border:0;outline:0;background:transparent;padding:0 18px;font-size:1.08em;border-radius:0}
.bigsearch button{border:0;background:var(--accent);color:var(--accent-ink);padding:0 22px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.chip{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:99px;padding:3px 12px;font-size:.82em;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;width:min(840px,100%);margin-top:38px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px 10px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);border-radius:var(--radius);text-align:center;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .ti{width:42px;height:42px;display:grid;place-items:center;border-radius:calc(var(--radius) - 1px);background:var(--paper);font:700 18px var(--mono);overflow:hidden}
.tile .ti img{width:26px;height:26px}
.tile .tn2{font-size:.82em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tm{position:absolute;top:3px;right:3px;opacity:0;display:flex}
.tile:hover .tm,.tile:focus-within .tm{opacity:1}
.tile.add{border-style:dashed;color:var(--ink2);justify-content:center}
.recent{width:min(840px,100%);margin-top:30px}
.recent h2{font-size:.95em;margin-bottom:8px}
.recent a{display:flex;gap:10px;padding:5px 2px;text-decoration:none;color:var(--ink);font-size:.9em;border-bottom:1px solid var(--line)}
.recent a span:last-child{margin-left:auto;color:var(--ink2);font-size:.85em}
.bgctl{position:sticky;bottom:14px;align-self:flex-end;margin-right:16px;display:flex;gap:6px;padding-bottom:2px;z-index:2}

/* search */
.shead{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.shead form{flex:1;min-width:240px;max-width:640px;display:flex;border:1px solid var(--line);background:var(--surface);border-radius:calc(var(--radius) + 4px);height:42px;overflow:hidden}
.shead form:focus-within{border-color:var(--accent)}
.shead form input{flex:1;border:0;outline:0;background:transparent;padding:0 14px;border-radius:0}
.shead form button{border:0;background:var(--accent);color:var(--accent-ink);padding:0 16px;font-weight:600}
.stabs{display:flex;gap:2px;margin:16px 0 18px;border-bottom:1px solid var(--line)}
.stab{border:0;background:none;padding:7px 14px;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--ink2)}
.stab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.res{max-width:800px}
.res>*+*{margin-top:18px}
.ans{padding:18px 20px}
.ans .aq{color:var(--ink2);font-size:.9em}
.ans .av{font-size:2em;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.wcard{display:flex;gap:16px}
.wcard img{width:140px;height:140px;object-fit:cover;border-radius:calc(var(--radius) - 2px);flex:none}
.wcard h3{font-size:1.2em;margin-bottom:4px}
.wcard p{margin:6px 0 10px}
.hit .ht{font-weight:600;font-size:1.05em;text-decoration:none}
.hit .ht:hover{text-decoration:underline}
.hit .hh{font-size:.8em;color:var(--ink2)}
.hit p{margin:2px 0 0}
.hit mark{background:color-mix(in srgb,var(--hi) 45%,transparent);color:inherit;border-radius:2px}
.sec-t{font-size:.95em;margin-bottom:10px;font-weight:700}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px 14px}
.vcard{display:block;text-decoration:none;color:var(--ink)}
.vthumb{position:relative;aspect-ratio:16/9;background:#1a1f1d;border-radius:var(--radius);overflow:hidden}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.82);color:#fff;font:500 11px var(--mono);padding:1px 5px;border-radius:3px}
.vt{font-weight:600;font-size:.92em;margin-top:7px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vm{font-size:.8em}
.igrid{column-width:190px;column-gap:10px}
.igrid img{width:100%;margin-bottom:10px;border-radius:calc(var(--radius) - 2px);display:block;cursor:zoom-in;break-inside:avoid;background:var(--line)}
.ext{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lb{background:rgba(0,0,0,.82)}
.lbox{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:94vw;max-height:94vh}
.lbox img{max-width:92vw;max-height:78vh;object-fit:contain;border-radius:4px;background:#000}
.lbox .cap{color:#fff;font-size:.85em;max-width:80ch;text-align:center}
.player{width:100%;aspect-ratio:16/9;border:0;background:#000;border-radius:var(--radius);display:block}
.wrap{max-width:980px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:.82em;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--paper)}
.note{padding:10px 14px;border-left:4px solid var(--hi);background:color-mix(in srgb,var(--hi) 14%,var(--surface));border-radius:0 var(--radius) var(--radius) 0;font-size:.88em;display:flex;gap:12px;align-items:flex-start}
.note code,code{font:.9em var(--mono);background:color-mix(in srgb,var(--ink) 8%,transparent);padding:1px 5px;border-radius:3px}

/* settings */
.set{display:grid;grid-template-columns:170px 1fr;gap:26px;align-items:start}
.snav{position:sticky;top:0;display:flex;flex-direction:column;gap:2px;padding-top:4px}
.snav button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:var(--radius);color:var(--ink2)}
.snav button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.sec{margin-bottom:20px}
.sec h2{font-size:1.1em;margin-bottom:6px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:11px 0;border-top:1px solid var(--line)}
.sec h2+.srow{border-top:0}
.sn{font-weight:600;font-size:.95em}
.sd{font-size:.82em;max-width:46ch}
.sc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rng{display:flex;gap:10px;align-items:center}
.rng output{font:.8em var(--mono);min-width:3.4em;text-align:right}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{border:1px solid var(--line);border-radius:var(--radius);padding:0;overflow:hidden;width:92px;background:var(--surface);text-align:left}
.sw i{display:block;height:26px}
.sw span{display:block;padding:3px 8px;font-size:.78em}
.sw:hover{border-color:var(--accent)}
.sclist{width:100%}
.scr{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:.9em}
.scr .u{color:var(--ink2);font-size:.85em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbd{font:500 .78em var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 6px;background:var(--paper);white-space:nowrap}
.keys{width:100%;border-collapse:collapse;font-size:.88em}
.keys td{padding:5px 0;border-top:1px solid var(--line)}
.keys td:last-child{text-align:right}
.hlist .hrow{display:flex;gap:14px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.9em}
.hlist .hrow:first-child{border-top:0}
.hrow .ht{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.hrow .hu{width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85em}
.hrow .hd{font-size:.8em;white-space:nowrap}
.fin{width:100%;max-width:420px;margin-bottom:14px}

/* css page */
.css-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.css-ed{display:flex;flex-direction:column;gap:8px;min-height:0}
.css-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.css-ta{width:100%;min-height:420px;resize:vertical;font:13px/1.6 var(--mono);tab-size:2;white-space:pre;overflow:auto;border-radius:var(--radius)}
.snip{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:6px 10px;margin-bottom:6px;font-size:.86em}
.snip:hover{border-color:var(--accent)}
.snip code{display:block;margin-top:2px;background:none;padding:0;color:var(--ink2);font-size:.82em}
.hooks{font-size:.84em;columns:2;column-gap:14px;margin:0;padding-left:0;list-style:none}
.hooks li{margin-bottom:3px}

/* misc */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:var(--radius);font-size:.88em;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:200;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;z-index:120}
.modal{width:min(460px,92vw);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:calc(var(--radius) + 2px);padding:20px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal label{display:grid;gap:4px;font-size:.85em;font-weight:600}
.modal label input{font-weight:400;font-size:1.05em}
.modal .end{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.ctx{position:fixed;z-index:150;min-width:180px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 30px rgba(0,0,0,.25);padding:4px}
.ctx button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:4px;font-size:.88em}
.ctx button:hover{background:color-mix(in srgb,var(--accent) 16%,transparent)}
body.inspecting,body.inspecting *{cursor:crosshair!important}

/* devtools */
#dev{flex:none;height:var(--devh);display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--line);font:12px/1.5 var(--mono);color:var(--ink);position:relative}
#dev-grip{position:absolute;top:-3px;left:0;right:0;height:7px;cursor:ns-resize;z-index:3}
#dev-head{display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--ink) 5%,var(--surface));flex:none}
#dev-head [data-t]{border:0;background:transparent;padding:6px 10px;font:12px var(--mono);border-bottom:2px solid transparent;color:var(--ink2)}
#dev-head [data-t].on{border-bottom-color:var(--accent);color:var(--ink)}
#dev-head .sp{flex:1}
#dev-head .ib.on{background:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--accent)}
#dev-body{flex:1;min-height:0;overflow:hidden;display:flex}
.dv-split{display:flex;flex:1;min-width:0;min-height:0}
.dv-tree{flex:1.3;overflow:auto;padding:4px 0;border-right:1px solid var(--line);min-width:0}
.dv-det{flex:1;overflow:auto;padding:8px 12px;min-width:0}
.tn-row{display:flex;gap:4px;cursor:default;white-space:nowrap;padding-right:8px}
.tn-row:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tn-row.sel{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.caret{width:10px;flex:none;text-align:center;color:var(--ink2);cursor:pointer}
.caret::before{content:'\25B8'}
.caret.open::before{content:'\25BE'}
.caret.none::before{content:''}
.t-tag{color:var(--c-tag)}.t-an{color:var(--c-attr)}.t-av{color:var(--c-val)}.t-tx{color:var(--ink2)}
.dv-h{font-weight:600;color:var(--c-tag);margin-bottom:8px;word-break:break-all}
.dv-s{font-weight:600;margin:12px 0 4px;color:var(--ink2)}
.kv{display:flex;gap:6px;align-items:center;margin-bottom:3px}
.kv span{color:var(--c-attr);min-width:70px}
.kv input,.dv-det textarea{font:12px var(--mono);padding:2px 6px;flex:1;width:100%;border-radius:3px}
.dv-det textarea{min-height:70px;resize:vertical}
.dv-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.dv-btns button{font:11px var(--mono);padding:3px 8px;border:1px solid var(--line);background:var(--surface);border-radius:4px}
.cx{display:flex;flex-direction:column;flex:1;min-width:0}
.cx-out{flex:1;overflow:auto}
.cx-line{display:flex;gap:8px;align-items:center;padding:4px 10px;border-top:1px solid var(--line);color:var(--accent)}
.cx-in{flex:1;border:0!important;outline:0;background:transparent!important;font:12px var(--mono);color:var(--ink);padding:3px 0!important}
.lg{display:flex;gap:8px;padding:2px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);white-space:pre-wrap;word-break:break-word}
.lg-t{width:10px;color:var(--ink2);flex:none}
.lg.error{color:#b42318;background:color-mix(in srgb,#b42318 9%,transparent)}
.lg.warn{color:#8a5a00;background:color-mix(in srgb,var(--hi) 16%,transparent)}
.lg.in{color:var(--ink2)}
.nw{flex:1;display:flex;flex-direction:column;min-width:0}
.nw-bar{display:flex;gap:8px;padding:4px 8px;border-bottom:1px solid var(--line);align-items:center}
.nw-bar input{font:12px var(--mono);padding:2px 6px}
.nw-t{flex:1;overflow:auto}
.nw table,.ap table{width:100%;border-collapse:collapse}
.nw th,.ap th{position:sticky;top:0;background:var(--surface);text-align:left;padding:3px 10px;color:var(--ink2);font-weight:500;border-bottom:1px solid var(--line)}
.nw td,.ap td{padding:2px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);max-width:44ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap{flex:1;overflow:auto;padding:6px 0}
.srcw{flex:1;display:flex;flex-direction:column;min-width:0}
.src{flex:1;margin:0;overflow:auto;padding:8px 12px;white-space:pre;tab-size:2}
.dv-css{flex:1;display:flex;flex-direction:column;padding:8px;min-width:0}
.dv-css .css-ta{min-height:0;flex:1;resize:none}
#hl{position:fixed;pointer-events:none;z-index:9998;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent);display:none}
#hl i{position:absolute;left:-1px;top:-20px;background:var(--accent);color:var(--accent-ink);font:11px var(--mono);padding:1px 6px;font-style:normal;white-space:nowrap;border-radius:3px 3px 0 0}

@media (max-width:760px){
  .set{grid-template-columns:1fr}.snav{position:static;flex-direction:row;flex-wrap:wrap}
  .css-grid{grid-template-columns:1fr}.wcard{flex-direction:column}.srow{flex-direction:column;align-items:flex-start}.sc{justify-content:flex-start}
  #toolbar .ib.opt{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>

code:'M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16',clock:'M12 7v5l3 2M3 12a9 9 0 1 0 3-6.7M3 4v4h4',lock:'M7 11V8a5 5 0 0110 0v3M5 11h14v9H5z',

  const bg=dark?'#151c19':'#dfe6dc',ln=dark?'#27332d':'#c0cbbc';let p='';
  [[430,370,1,18],[1190,640,.75,13]].forEach(([cx,cy,k,n],ci)=>{for(let i=1;i<=n;i++){const r=i*36*k;let d='';

/* ---------- applying settings ---------- */

    ...INV.map(b=>tryFetch(b+'/api/v1/search?q='+enc(q)+'&type=video',7000).then(d=>{

const U={m:1,km:1000,cm:.01,mm:.001,mi:1609.344,mile:1609.344,miles:1609.344,ft:.3048,foot:.3048,feet:.3048,in:.0254,inch:.0254,inches:.0254,yd:.9144,yard:.9144,yards:.9144,meter:1,meters:1,
  kg:1,g:.001,mg:1e-6,lb:.45359237,lbs:.45359237,oz:.028349523,pound:.45359237,pounds:.45359237,
  l:1,ml:.001,liter:1,liters:1,gal:3.785411784,gallon:3.785411784,gallons:3.785411784,cup:.2365882365,cups:.2365882365};
const UG={length:['m','km','cm','mm','mi','mile','miles','ft','foot','feet','in','inch','inches','yd','yard','yards','meter','meters'],mass:['kg','g','mg','lb','lbs','oz','pound','pounds'],vol:['l','ml','liter','liters','gal','gallon','gallons','cup','cups']};
function convert(q){
  const m=q.toLowerCase().match(/^(-?[\d.]+)\s*°?([a-z]+)\s+(?:to|in|into|as)\s+°?([a-z]+)$/);if(!m)return null;
  const n=parseFloat(m[1]),a=m[2],b=m[3];if(isNaN(n))return null;
  const T={c:1,celsius:1,f:1,fahrenheit:1,k:1,kelvin:1};
  if(T[a]&&T[b]){const k=a[0]==='c'?n+273.15:a[0]==='f'?(n-32)*5/9+273.15:n;const r=b[0]==='c'?k-273.15:b[0]==='f'?(k-273.15)*9/5+32:k;return {q:n+' '+a+' in '+b,a:(+r.toFixed(3))+' '+b}}
  const grp=Object.values(UG).find(g=>g.includes(a)&&g.includes(b));if(!grp)return null;
  return {q:n+' '+a+' in '+b,a:(+(n*U[a]/U[b]).toPrecision(8))+' '+b};
}
function calc(q){
  const s=q.toLowerCase().replace(/^(calc|calculate)\s+/,'').replace(/^=\s*/,'').replace(/×/g,'*').replace(/÷/g,'/');
  if(!/[0-9]/.test(s)||!/[-+*/^%]|sqrt|sin|cos|tan|log|abs|round|floor|ceil|pi/.test(s))return null;
  if(!/^[0-9a-z+\-*/().%^\s]+$/.test(s))return null;
  const ok=['sqrt','sin','cos','tan','log','abs','round','floor','ceil','pi','e'];
  if((s.match(/[a-z]+/g)||[]).some(w=>!ok.includes(w)))return null;
  try{
    const js=s.replace(/\^/g,'**').replace(/\b(sqrt|sin|cos|tan|log|abs|round|floor|ceil)\b/g,'Math.$1').replace(/\bpi\b/g,'Math.PI').replace(/\be\b/g,'Math.E');
    const v=Function('"use strict";return ('+js+')')();
    return typeof v==='number'&&isFinite(v)?+v.toPrecision(12):null;
  }catch(e){return null}
}
function ansCard(q,a){return h('div',{class:'card ans'},h('div',{class:'aq'},q),h('div',{class:'av'},a))}
function instant(q){
  const c=calc(q);if(c!==null)return ansCard(q+' =',String(c));
  const v=convert(q);if(v)return ansCard(v.q,v.a);
  if(/^(time|date|current time|what time is it|what day is it|today)$/i.test(q)){const d=new Date();
    return ansCard(Intl.DateTimeFormat().resolvedOptions().timeZone,d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'  '+d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}))}
  return null;
}

    h('button',{onclick:()=>{pushLog('log',['$0 =',el]);DV.tab='console';devRender()}},'Send to console'),
    h('button',{onclick:()=>{const p=el.parentElement;el.remove();devRender();if(p)select(p,true)}},'Delete node')));
}
function startInspect(){
  if(!DV.on)devOpen('elements');else if(DV.tab!=='elements'){DV.tab='elements';devRender()}
  DV.insp=true;document.body.classList.add('inspecting');$('#dev-inspect').classList.add('on');
  document.addEventListener('mousemove',inspMove,true);document.addEventListener('click',inspClick,true);
}
function stopInspect(){DV.insp=false;document.body.classList.remove('inspecting');$('#dev-inspect').classList.remove('on');document.removeEventListener('mousemove',inspMove,true);document.removeEventListener('click',inspClick,true)}
function inspMove(e){if(!isDev(e.target))highlight(e.target)}
function inspClick(e){if(isDev(e.target))return;e.preventDefault();e.stopPropagation();const t=e.target;stopInspect();select(t,true)}

/* console */
const rawConsole={};['log','info','warn','error','debug'].forEach(k=>{const orig=typeof console[k]==='function'?console[k]:(typeof console.log==='function'?console.log:function(){});rawConsole[k]=(...a)=>{try{orig.apply(console,a)}catch(e){}};console[k]=(...a)=>{rawConsole[k](...a);pushLog(k==='debug'?'log':k,a)}});
addEventListener('error',e=>pushLog('error',[e.message||'Script error']));
addEventListener('unhandledrejection',e=>pushLog('error',['Unhandled promise rejection: '+fmt(e.reason)]));
function fmt(v){
  if(v===undefined)return 'undefined';if(v===null)return 'null';
  if(typeof v==='string')return v;if(typeof v==='function')return 'ƒ '+(v.name||'anonymous')+'()';
  if(v instanceof Error)return v.name+': '+v.message;
  if(v instanceof Element)return '<'+selectorOf(v)+'>';
  try{return JSON.stringify(v,(k,x)=>x instanceof Element?'<'+selectorOf(x)+'>':typeof x==='function'?'ƒ '+x.name+'()':x,2)}catch(e){return String(v)}
}
function pushLog(type,args){
  const e={type,text:args.map(fmt).join(' ')};DV.logs.push(e);if(DV.logs.length>500)DV.logs.shift();
  if(DV.cout&&DV.cout.isConnected)addLog(e);
}
function addLog(e){DV.cout.append(h('div',{class:'lg '+e.type},h('span',{class:'lg-t'},e.type==='in'?'>':e.type==='result'?'<':''),e.text));DV.cout.scrollTop=DV.cout.scrollHeight}
const cHist=[];let cPos=0;
function runCode(code){
  pushLog('in',[code]);
  try{
    const r=(0,eval)(code);
    const show=v=>pushLog('result',[typeof v==='string'?JSON.stringify(v):fmt(v)]);
    if(r&&typeof r.then==='function')r.then(show,e=>pushLog('error',[e]));else show(r);
  }catch(e){pushLog('error',[e])}
}
function devConsole(){
  const out=h('div',{class:'cx-out'}),inp=h('input',{class:'cx-in',type:'text',placeholder:'Run JavaScript. Try $0, $("#toolbar"), brawsler.open("youtube.com")',spellcheck:'false',autocomplete:'off','aria-label':'Console input'});
  DV.body().append(h('div',{class:'cx'},out,h('div',{class:'cx-line'},'>',inp)));
  DV.cout=out;DV.logs.forEach(addLog);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&inp.value.trim()){const c=inp.value;cHist.push(c);cPos=cHist.length;inp.value='';runCode(c)}
    else if(e.key==='ArrowUp'){e.preventDefault();if(cPos>0)inp.value=cHist[--cPos]||''}
    else if(e.key==='ArrowDown'){e.preventDefault();inp.value=cPos<cHist.length-1?cHist[++cPos]:(cPos=cHist.length,'')}
    else if(e.key==='l'&&e.ctrlKey){e.preventDefault();DV.logs=[];out.replaceChildren()}
  });
  setTimeout(()=>inp.focus(),0);out.scrollTop=out.scrollHeight;
}
/* network */
function logNet(e){e.id=DV.net.length+1;e.t=new Date();DV.net.push(e);if(DV.net.length>400)DV.net.shift();netDraw();return e}
const _fetch=typeof window.fetch==='function'?window.fetch.bind(window):()=>Promise.reject(new Error('fetch is not available in this environment'));
window.fetch=function(input,init){
  const url=typeof input==='string'?input:(input.url||String(input));
  const e=logNet({type:'fetch',method:(init&&init.method)||(input&&input.method)||'GET',url,status:'pending'});const t0=performance.now();
  return _fetch(input,init).then(r=>{e.status=r.status;e.ms=Math.round(performance.now()-t0);netDraw();return r},err=>{e.status='failed';e.ms=Math.round(performance.now()-t0);netDraw();throw err});
};
function netDraw(){
  const b=DV.nwBody;if(!b||!b.isConnected)return;const f=(DV.nwFilter||'').toLowerCase();
  b.replaceChildren(...DV.net.filter(e=>!f||e.url.toLowerCase().includes(f)).map(e=>h('tr',{title:e.url},h('td',{},e.id),h('td',{},e.method),h('td',{style:{color:e.status>=400||e.status==='failed'?'#b42318':''}},e.status),h('td',{},e.type),h('td',{},e.url),h('td',{},e.ms!=null?e.ms+' ms':''))));
}
function devNetwork(){
  const tb=h('tbody'),fi=h('input',{type:'text',placeholder:'Filter by URL','aria-label':'Filter network',oninput:e=>{DV.nwFilter=e.target.value;netDraw()}});fi.value=DV.nwFilter||'';
  DV.body().append(h('div',{class:'nw'},h('div',{class:'nw-bar'},fi,h('button',{class:'btn sm',onclick:()=>{DV.net=[];netDraw()}},'Clear'),h('span',{class:'dim'},'Requests Brawsler makes, and every page it loads in a frame.')),
    h('div',{class:'nw-t'},h('table',{},h('thead',{},h('tr',{},...['#','Method','Status','Type','URL','Time'].map(x=>h('th',{},x)))),tb))));
  DV.nwBody=tb;netDraw();
}
/* sources */
function devSources(){
  const scope=h('select',{'aria-label':'Source to view'},h('option',{value:'app'},'Brawsler (live DOM)'),h('option',{value:'page'},'Current page: '+(active&&active.title||'')));
  const pre=h('pre',{class:'src'});
  const load=async()=>{
    pre.textContent='Loading…';
    const clean=s=>s.replace(/data:[a-z\/+.-]+;base64,[A-Za-z0-9+\/=]{120,}/g,'data:…[truncated]').slice(0,400000);
    if(scope.value==='app'){pre.textContent=clean('<!DOCTYPE html>\n'+document.documentElement.outerHTML);return}
    const t=active;
    if(t.url.startsWith('brawsler://')){pre.textContent=clean(t.el.outerHTML);return}
    try{const r=await fetch(t.url);pre.textContent=clean(await r.text())}
    catch(e){pre.textContent='Can’t read the source of '+t.url+'.\nThe site doesn’t allow other pages to fetch it. Use “Open in a browser tab”, then view source there.'}
  };
  scope.addEventListener('change',load);
  DV.body().append(h('div',{class:'srcw'},h('div',{class:'nw-bar'},scope),pre));
  if(DV.wantPage){scope.value='page';DV.wantPage=false}load();
}
/* application */
function devApp(){
  const keys=(()=>{try{return Object.keys(localStorage).filter(k=>k.startsWith('brawsler.')).sort()}catch(e){return []}})();
  const wrap=h('div',{class:'ap'});
  const draw=()=>{
    wrap.replaceChildren();let tot=0;
    const rows=keys.filter(k=>localStorage.getItem(k)!=null).map(k=>{const v=localStorage.getItem(k)||'';tot+=v.length;
      return h('tr',{},h('td',{},k.replace('brawsler.','')),h('td',{},(v.length>1024?(v.length/1024).toFixed(1)+' KB':v.length+' B')),h('td',{},v.slice(0,90)),
        h('td',{},h('button',{class:'link',onclick:()=>{localStorage.removeItem(k);keys.splice(keys.indexOf(k),1);draw()}},'delete')))});
    wrap.append(h('div',{class:'nw-bar'},h('b',{},'Local storage'),h('span',{class:'dim'},(tot/1024).toFixed(0)+' KB used of about 5,000 KB'),
      h('button',{class:'btn sm danger',onclick:()=>{keys.forEach(k=>localStorage.removeItem(k));keys.length=0;draw()}},'Delete all')),
      h('table',{},h('thead',{},h('tr',{},...['Key','Size','Value',''].map(x=>h('th',{},x)))),h('tbody',{},...rows)));
  };
  draw();DV.body().append(wrap);
}

/* ---------- keyboard ---------- */
function stop(e){e.preventDefault();e.stopPropagation()}
function focusOmni(){omni.focus();omni.select()}
addEventListener('keydown',e=>{
  const k=e.key,c=e.ctrlKey||e.metaKey,a=e.altKey,s=e.shiftKey,code=e.code;
  const L=x=>code==='Key'+x.toUpperCase()||k.toLowerCase()===x;
  if(k==='F12'||(c&&s&&L('i'))||(e.metaKey&&a&&L('i'))){stop(e);devToggle();return}
  if((c&&s&&L('j'))||(e.metaKey&&a&&L('j'))){stop(e);devOpen('console');return}
  if((c&&s&&L('c'))||(e.metaKey&&a&&L('c'))){stop(e);DV.insp?stopInspect():startInspect();return}
  if(c&&!s&&!a&&L('u')){stop(e);DV.wantPage=true;devOpen('sources');return}
  if(c&&s&&k==='Delete'){stop(e);clearDataModal();return}
  if(k==='Escape'){if(DV.insp)stopInspect();$$('.ctx').forEach(n=>n.remove());return}
  const pageNext=(c&&k==='PageDown')||(c&&!s&&k==='Tab'),pagePrev=(c&&k==='PageUp')||(c&&s&&k==='Tab');
  if(pageNext){stop(e);activate(tabs[(tabs.indexOf(active)+1)%tabs.length]);return}
  if(pagePrev){stop(e);activate(tabs[(tabs.indexOf(active)-1+tabs.length)%tabs.length]);return}
  if((c||a)&&!s&&/^[1-9]$/.test(k)&&!(c&&a)){const t=k==='9'?tabs[tabs.length-1]:tabs[+k-1];if(t){stop(e);activate(t)}return}
  if(((c||a)&&L('t'))&&!(c&&a)){stop(e);if(s){const u=closed.pop();if(u)newTab(u)}else newTab(S.home);return}
  if(((c||a)&&L('w'))&&!s&&!(c&&a)){stop(e);closeTab(active);return}
  if((c&&!s&&(L('l')||L('k')))||(a&&!c&&!s&&L('d'))||k==='F6'){stop(e);focusOmni();return}
  if(k==='F5'||(c&&!a&&L('r'))){stop(e);reload();return}
  if(a&&!c&&k==='ArrowLeft'){stop(e);back();return}
  if(a&&!c&&k==='ArrowRight'){stop(e);fwd();return}
  if(a&&!c&&k==='Home'){stop(e);go(active,S.home);return}
  if(c&&!s&&!a&&L('d')){stop(e);editShortcut(null,{name:active.title,url:active.url});return}
  if((a&&!c&&!s&&L('s'))||(c&&!a&&k===',')){stop(e);openInternal('settings');return}
  if(a&&!c&&!s&&L('c')){stop(e);openInternal('css');return}
  if(c&&s&&L('b')){stop(e);S.shortbar=!S.shortbar;saveS();return}
  if(!(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)&&!(c||a))){
    const combo=comboOf(e);
    if(combo&&(c||a||/^F\d+$/.test(k))){const hit=SC.find(x=>x.key&&x.key===combo);if(hit){stop(e);go(active,hit.url)}}
  }
},true);
function openInternal(n){const u='brawsler://'+n;if(active.url===u)return;const ex=tabs.find(t=>t.url===u);if(ex)activate(ex);else newTab(u)}

/* ---------- wiring ---------- */
$$('[data-ic]').forEach(b=>b.prepend(icon(b.dataset.ic)));
$('#b-new').addEventListener('click',()=>newTab(S.home));
$('#b-back').addEventListener('click',back);$('#b-fwd').addEventListener('click',fwd);$('#b-reload').addEventListener('click',reload);
$('#b-home').addEventListener('click',()=>go(active,S.home));
$('#b-star').addEventListener('click',()=>editShortcut(null,{name:active.title,url:active.url}));
$('#b-hist').addEventListener('click',()=>openInternal('history'));
$('#b-css').addEventListener('click',()=>openInternal('css'));
$('#b-set').addEventListener('click',()=>openInternal('settings'));
$('#b-dev').addEventListener('click',devToggle);
$('#f-bg').addEventListener('change',e=>{if(e.target.files[0])setImage('bg',e.target.files[0]).then(()=>{tabs.forEach(t=>{if(t.url==='brawsler://newtab')load(t)})});e.target.value=''});
$('#f-tb').addEventListener('change',e=>{if(e.target.files[0])setImage('tb',e.target.files[0]);e.target.value=''});
$('#f-font').addEventListener('change',e=>{if(e.target.files[0])loadFontFile(e.target.files[0]);e.target.value=''});
$('#f-css').addEventListener('change',e=>{const f=e.target.files[0];if(f)f.text().then(x=>{setCSS(x,null);CSSBOX.forEach(b=>{b.ta.value=x});toast('CSS loaded.')});e.target.value=''});
$('#f-import').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
  f.text().then(x=>{try{const d=JSON.parse(x);if(d.settings)LS.set('settings',d.settings);if(d.shortcuts)LS.set('shortcuts',d.shortcuts);if(typeof d.css==='string')LS.set('css',d.css);if(d.history)LS.set('history',d.history);
    if(d.images&&d.images.bg)LS.set('bgimg',d.images.bg);if(d.images&&d.images.tb)LS.set('tbimg',d.images.tb);location.reload()}catch(err){toast('That file isn’t a Brawsler backup.')}});e.target.value=''});
window.$=$;window.$$=$$;window.clear=()=>{DV.logs=[];if(DV.cout)DV.cout.replaceChildren()};
window.brawsler={open:(u)=>newTab(u),go:(u)=>go(active,u),tabs:()=>tabs.map(t=>({title:t.title,url:t.url})),settings:S,css:(v)=>{if(v!=null)setCSS(String(v),null);return CSS_TEXT},shortcuts:()=>SC,version:'1.0'};

applySettings();renderShortbar();
newTab(S.home);
console.info('Brawsler ready. Open developer tools with F12.');
})();
</script>
